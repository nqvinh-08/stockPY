services:
  app:
    build: 
      context: . #lay code tu thu muc hien tai
      dockerfile: dockerfile.app
    ports:
      - "8000:8000" #host : container
    volumes:
      - ./app:/app
    depends_on:
      - api
    environment:
      API_URL: ${API_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
    command: uvicorn main_app:app --host 0.0.0.0 --port 8000 --reload
    restart: always
  api:
    build:
      context: .
      dockerfile: dockerfile.api
    ports:
      - "8001:8000"
    volumes:
      - ./api:/api
      - ./business_data:/api/business_data
    depends_on:
      - clickhouse
    environment:
      PASSCLICKHOUSE: ${PASSCLICKHOUSE}
      DATABASECLICKHOUSE: ${DATABASECLICKHOUSE}
      USERCLICKHOUSE: ${USERCLICKHOUSE}
      HOSTCLICKHOUSE: clickhouse
      PORTCLICKHOUSE: ${PORTCLICKHOUSE}
      API_URL: ${API_URL}
      URLAPI: ${URLAPI}
      URLAPI2: ${URLAPI2}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
    command: uvicorn main_api:app --host 0.0.0.0 --port 8000 --reload
    restart: always

  clickhouse:
    image: clickhouse/clickhouse-server:latest #lay tu docker-hub
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: ${DATABASECLICKHOUSE}
      CLICKHOUSE_USER: ${USERCLICKHOUSE}
      CLICKHOUSE_PASSWORD: ${PASSCLICKHOUSE}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    restart: always

  # ====================================================
  # AIRFLOW METADATA DATABASE
  # ====================================================
  airflow-db:
    image: postgres:17
    container_name: airflow-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - airflow_postgres:/var/lib/postgresql/data
    restart: always

  # ====================================================
  # AIRFLOW INIT
  # ====================================================
  airflow-init:
    build:
      context: .
      dockerfile: dockerfile.airflow
    container_name: airflow-init
    depends_on:
      - airflow-db
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW_ADMIN_FIRSTNAME: ${AIRFLOW_ADMIN_FIRSTNAME}
      AIRFLOW_ADMIN_LASTNAME: ${AIRFLOW_ADMIN_LASTNAME}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL}
      PYTHONPATH: /opt/airflow/project:/opt/airflow/StockThucTap

    volumes:
      - .:/opt/airflow/project
      - ./airflow/dags:/opt/airflow/dags
      - /home/vinh/Documents/StockThucTap:/opt/airflow/StockThucTap
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username $$AIRFLOW_ADMIN_USERNAME
      --password $$AIRFLOW_ADMIN_PASSWORD
      --firstname $$AIRFLOW_ADMIN_FIRSTNAME
      --lastname $$AIRFLOW_ADMIN_LASTNAME
      --role Admin
      --email $$AIRFLOW_ADMIN_EMAIL || true
      "
  # ====================================================
  # AIRFLOW WEBSERVER
  # ====================================================
  airflow-webserver:
    build:
      context: .
      dockerfile: dockerfile.airflow
    container_name: airflow-webserver
    depends_on:
      - airflow-db
      - airflow-init
    ports:
      - "8090:8080"
    environment:
      HOSTCLICKHOUSE: clickhouse
      PORTCLICKHOUSE: ${PORTCLICKHOUSE}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
      PYTHONPATH: /opt/airflow/project:/opt/airflow/StockThucTap
    volumes:
      - .:/opt/airflow/project
      - ./airflow/dags:/opt/airflow/dags
      - /home/vinh/Documents/StockThucTap:/opt/airflow/StockThucTap
    command: airflow webserver
    restart: always

  # ====================================================
  # AIRFLOW SCHEDULER
  # ====================================================
  airflow-scheduler:
    build:
      context: .
      dockerfile: dockerfile.airflow
    container_name: airflow-scheduler
    depends_on:
      - airflow-db
      - airflow-init
    environment:
      HOSTCLICKHOUSE: clickhouse
      PORTCLICKHOUSE: ${PORTCLICKHOUSE}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
      PYTHONPATH: /opt/airflow/project:/opt/airflow/StockThucTap
    volumes:
      - .:/opt/airflow/project
      - ./airflow/dags:/opt/airflow/dags
      - /home/vinh/Documents/StockThucTap:/opt/airflow/StockThucTap
    command: airflow scheduler
    restart: always

volumes:
  clickhouse_data:
  airflow_postgres:
